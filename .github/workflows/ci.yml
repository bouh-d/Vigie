name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build Vigie.sln -c Release --no-restore

      - name: Test
        run: dotnet test Vigie.sln -c Release --no-build

      - name: Verify formatting
        run: dotnet format Vigie.sln --verify-no-changes --no-restore

  # Runs the published executable in the runner's desktop session and checks
  # that every power setting it changes comes back, including after it is
  # killed. The lid and battery cases still need a real laptop.
  restore-checks:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: >-
          dotnet publish src/Vigie.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # The runner's default 1024x768 screen cuts the window off in the
      # screenshot. Not every runner image has the cmdlet.
      - name: Use a larger screen
        continue-on-error: true
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Restore checks
        shell: powershell
        run: ./tests/e2e/restore-checks.ps1 -Executable publish/Vigie.exe -OutputDirectory restore-checks

      - name: Keep the journal and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restore-checks
          path: restore-checks/
          if-no-files-found: ignore
