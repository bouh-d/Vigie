name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build Vigie.sln -c Release --no-restore

      - name: Test
        run: dotnet test Vigie.sln -c Release --no-build

      - name: Verify formatting
        run: dotnet format Vigie.sln --verify-no-changes --no-restore
