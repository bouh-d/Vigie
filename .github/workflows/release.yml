name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Vigie.App -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -o "publish/$rid"
            Compress-Archive -Path "publish/$rid/Vigie.exe" -DestinationPath "artifacts/Vigie-$rid.zip"
          }

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/Vigie-win-x64.zip artifacts/Vigie-win-arm64.zip artifacts/SHA256SUMS.txt `
            --draft --title "${{ github.ref_name }}" --generate-notes
